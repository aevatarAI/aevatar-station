<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .server-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .server-card {
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .server-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .server-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .server-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .server-card p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .env-indicator {
            background: #ff6b6b;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-top: 10px;
            display: inline-block;
        }

        .tools-section {
            display: none;
            margin-top: 30px;
        }

        .tools-section.active {
            display: block;
        }

        .tool-item {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tool-item:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .tool-item.selected {
            background: #f0f4ff;
            border-color: #667eea;
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tool-name {
            font-weight: bold;
            color: #333;
        }

        .tool-description {
            color: #666;
            font-size: 0.9rem;
        }

        .parameters-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .parameters-section.active {
            display: block;
        }

        .parameter-group {
            margin-bottom: 15px;
        }

        .parameter-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .parameter-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .parameter-required {
            color: #ff6b6b;
        }

        .call-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .call-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .call-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .result-success {
            border-left: 4px solid #28a745;
            padding-left: 15px;
        }

        .result-error {
            border-left: 4px solid #dc3545;
            padding-left: 15px;
        }

        .result-content {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .health-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .health-ok {
            background: #28a745;
            color: white;
        }

        .health-error {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="health-indicator" id="healthIndicator">Checking...</div>
    
    <div class="container">
        <div class="header">
            <h1>🛠️ MCP Server Test Interface</h1>
            <p>Test and explore Model Context Protocol servers and their tools</p>
        </div>

        <div class="main-content">
            <!-- Server Selection Section -->
            <div class="section">
                <h2>📡 Available MCP Servers</h2>
                <div class="server-list" id="serverList">
                    <div class="server-card" id="loadingMessage">Loading servers...</div>
                </div>
            </div>

            <!-- Tools Section -->
            <div class="section tools-section" id="toolsSection">
                <h2>🔧 Available Tools</h2>
                <div id="toolsList"></div>
            </div>

            <!-- Parameters Section -->
            <div class="parameters-section" id="parametersSection">
                <h2>⚙️ Tool Parameters</h2>
                <div id="parametersForm"></div>
                <button class="call-button" id="callButton">
                    <span id="callButtonText">Execute Tool</span>
                    <span class="loading" id="callButtonSpinner" style="display: none;"></span>
                </button>
            </div>

            <!-- Results Section -->
            <div class="results-section" id="resultsSection">
                <h2>📋 Execution Results</h2>
                <div id="resultsContent"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
